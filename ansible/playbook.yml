- hosts: minecraft
  become: yes
  tasks:
    - name: Update apt
      apt:
        update_cache: yes

    - name: Install Java
      apt:
        name: openjdk-25-jre-headless
        state: present

    - name: Create minecraft user
      user:
        name: minecraft
        home: /opt/minecraft
        system: yes

    - name: Create server directory
      file:
        path: /opt/minecraft/server
        state: directory
        owner: minecraft
        group: minecraft

    - name: Download server jar
      get_url:
        url: https://piston-data.mojang.com/v1/objects/97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51/server.jar
        dest: /opt/minecraft/server/server.jar
        owner: minecraft
        group: minecraft

    - name: Accept EULA
      copy:
        content: "eula=true\n"
        dest: /opt/minecraft/server/eula.txt
        owner: minecraft
        group: minecraft

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/minecraft.service
        content: "[Unit]\nDescription=Minecraft Server\nAfter=network.target\n\n[Service]\nUser=minecraft\nWorkingDirectory=/opt/minecraft/server\nExecStart=/usr/bin/java -Xmx2G -Xms1G -jar server.jar nogui\nExecStop=/bin/kill -s SIGINT $MAINPID\nRestart=on-failure\n\n[Install]\nWantedBy=multi-user.target\n"

